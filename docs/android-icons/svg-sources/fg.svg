    <path d="M214 392 Q256 360 298 392 Q280 410 256 410 Q232 410 214 392 Z" fill="#F08BA0"/>
    <path d="M256 328 L256 354" stroke="#2E3440" stroke-width="5" stroke-linecap="round"/>
