    <clipPath id="card"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
    <clipPath id="head"><ellipse cx="256" cy="300" rx="152" ry="126"/></clipPath>
  </defs><g transform="translate(256 256) scale(0.74) translate(-256 -270)">
    

