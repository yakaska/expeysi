    <path d="M362 330 Q342 300 298 320" fill="none" stroke="#D7DCE6" stroke-width="4" stroke-linecap="round"/>

    <!-- eyes -->
    <ellipse cx="204" cy="264" rx="25" ry="26" fill="url(#eye)" stroke="#2E3440" stroke-width="5"/>
    <ellipse cx="308" cy="264" rx="25" ry="26" fill="url(#eye)" stroke="#2E3440" stroke-width="5"/>
    <circle cx="206" cy="266" r="10.5" fill="#1F2430"/>
    <circle cx="306" cy="266" r="10.5" fill="#1F2430"/>
    <circle cx="211" cy="259" r="4.5" fill="#FFFFFF"/>
    <circle cx="311" cy="259" r="4.5" fill="#FFFFFF"/>

