    <path d="M186 186 C220 172 292 172 326 186" fill="none" stroke="#6E98EA" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <!-- Star of David -->
    <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">
      <path d="M256 124 L279 164 L233 164 Z"/>
      <path d="M256 178 L233 138 L279 138 Z"/>
