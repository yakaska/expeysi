name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore Google Services configuration
        working-directory: android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/expeysi-release.keystore"

      - name: Check tag version
        working-directory: android
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "v$VERSION_NAME" = "$GITHUB_REF_NAME"

      - name: Run checks
        working-directory: android
        run: ./gradlew ktlintCheck lint :app:testDebugUnitTest

      - name: Build release APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/expeysi-release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Prepare release artifacts
        working-directory: android
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          VERSION_NAME=${GITHUB_REF_NAME#v}
          mkdir -p "$RELEASE_DIR"
          cp app/build/outputs/apk/release/app-release.apk "$RELEASE_DIR/Expeysi-$VERSION_NAME.apk"
          cd "$RELEASE_DIR"
          sha256sum "Expeysi-$VERSION_NAME.apk" > "Expeysi-$VERSION_NAME.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: gh release create "$GITHUB_REF_NAME" "$RELEASE_DIR"/* --generate-notes --title "Expeysi $GITHUB_REF_NAME"
