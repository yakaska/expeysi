name: Release smoke

# Проверяет, что minified-сборка (releaseCheck: тот же R8 и resource-шринкинг,
# что у release, но с debug-подписью) не только собирается, но и запускается:
# unit-тесты и lint идут по debug-варианту, проблемы R8 видны только в release.
on:
  pull_request:
    paths:
      - "android/**"

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore Google Services configuration
        working-directory: android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name=kvm

      - name: Build minified APK and launch it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/release-smoke.sh"

      - name: Upload logcat on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-logcat
          path: release-smoke-logs/
          if-no-files-found: ignore
